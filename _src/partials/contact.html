<section class="contact" id="contact" data-snap data-reveal="section">

    <div class="lets-talk__ellipse" aria-hidden="true"></div>

    <div class="lets-talk-flex">

      <div class="lets-talk__info">
        <p class="lets-talk__info-connect" data-animate="fade">
          <span class="lets-talk__info-connect-icon" aria-hidden="true"></span>
          <span class="lets-talk__info-connect-text">בואו נתחיל</span>
        </p>

        <h2 class="lets-talk__info-heading" data-animate="title">בואו נבנה את<br><strong>הפרויקט הבא שלך</strong></h2>

        <div class="lets-talk__info-divider" aria-hidden="true"></div>

        <p class="lets-talk__info-subheading" data-animate="fade-up">נהפוך את החזון שלך לחוויה דיגיטלית שאי אפשר להתעלם ממנה.</p>

        <!-- שתי גרסאות נפרדות, כמו ברפרנס: הדסקטופית יושבת
             בתחתית טור המידע, הניידת מעל הטופס. -->
        <div class="lets-talk__socials --is-desktop" data-animate="fade-up">
          <a class="lets-talk__socials-link" href="{{SOCIAL_INSTAGRAM}}" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3.4A6.4 6.4 0 1 0 18.4 12 6.4 6.4 0 0 0 12 5.6zm0 10.6A4.2 4.2 0 1 1 16.2 12 4.2 4.2 0 0 1 12 16.2zm6.7-10.9a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5z"/></svg></a>

          <a class="lets-talk__socials-link" href="{{SOCIAL_LINKEDIN}}" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.3 0-2.95-1.8-2.95s-2.07 1.4-2.07 2.85V21H9z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_YOUTUBE}}" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23 12s0-3.4-.44-5a2.5 2.5 0 0 0-1.77-1.78C19.2 4.8 12 4.8 12 4.8s-7.2 0-8.79.42A2.5 2.5 0 0 0 1.44 7C1 8.6 1 12 1 12s0 3.4.44 5a2.5 2.5 0 0 0 1.77 1.78c1.59.42 8.79.42 8.79.42s7.2 0 8.79-.42A2.5 2.5 0 0 0 22.56 17C23 15.4 23 12 23 12zM9.75 15.02V8.98L15.5 12z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_TIKTOK}}" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.84-2.48v-3.2a5.77 5.77 0 1 0 4.93 5.71V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg></a>
        </div>

        <a class="lets-talk__contact-Email" href="mailto:hello@digitalframe.co.il" data-animate="fade-up">
          <span class="lets-talk__info-connect-icon --mail" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6.5l9 6.2 9-6.2"/></svg></span>
          <span>hello@digitalframe.co.il</span>
        </a>
      </div>

      <div class="lets-talk__form-wrapper" data-animate="fade-up">
        <h3 class="lets-talk__form-title">בואו נדבר</h3>

        <!-- אין שרת. השליחה מרכיבה mailto. להחלפה ב-endpoint אמיתי. -->
        <form class="lets-talk__form" id="contactForm" novalidate>

          <div class="form-group">
            <div class="form-group-field">
              <input class="form-input" id="f-name" name="name" type="text" placeholder="שם מלא" autocomplete="name" required>
              <label class="form-label" for="f-name">שם מלא</label>
              <div class="form-error" data-for="name"></div>
            </div>
            <div class="form-group-field">
              <input class="form-input" id="f-co" name="company" type="text" placeholder="חברה" autocomplete="organization">
              <label class="form-label" for="f-co">חברה</label>
              <div class="form-error" data-for="company"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="form-group-field">
              <input class="form-input" id="f-mail" name="email" type="email" placeholder="אימייל" autocomplete="email" required>
              <label class="form-label" for="f-mail">אימייל</label>
              <div class="form-error" data-for="email"></div>
            </div>
            <div class="form-group-field">
              <input class="form-input" id="f-tel" name="phone" type="tel" placeholder="טלפון" autocomplete="tel" inputmode="tel">
              <label class="form-label" for="f-tel">טלפון</label>
              <div class="form-error" data-for="phone"></div>
            </div>
          </div>

          <div class="form-group-field --is-checkbox">
            <p class="form-label --is-static" id="int-lbl">מה מעניין אותך?</p>
            <div class="interest-options" role="group" aria-labelledby="int-lbl">
              <button class="interest-option" type="button" aria-pressed="false">UI/UX</button>
              <button class="interest-option" type="button" aria-pressed="false">פיתוח</button>
              <button class="interest-option" type="button" aria-pressed="false">מיתוג</button>
              <button class="interest-option" type="button" aria-pressed="false">קמפיינים</button>
              <button class="interest-option" type="button" aria-pressed="false">אוטומציה</button>
            </div>
          </div>

          <div class="form-group-field --is-textarea">
            <textarea class="form-input is--textarea" id="f-msg" name="message" placeholder="ספר לנו על הפרויקט" rows="3"></textarea>
            <label class="form-label" for="f-msg">ספר לנו על הפרויקט</label>
          </div>

          <div class="lets-talk__socials --is-mobile">
            <a class="lets-talk__socials-link" href="{{SOCIAL_INSTAGRAM}}" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3.4A6.4 6.4 0 1 0 18.4 12 6.4 6.4 0 0 0 12 5.6zm0 10.6A4.2 4.2 0 1 1 16.2 12 4.2 4.2 0 0 1 12 16.2zm6.7-10.9a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_FACEBOOK}}" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_LINKEDIN}}" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.4c0-1.3 0-2.95-1.8-2.95s-2.07 1.4-2.07 2.85V21H9z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_YOUTUBE}}" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23 12s0-3.4-.44-5a2.5 2.5 0 0 0-1.77-1.78C19.2 4.8 12 4.8 12 4.8s-7.2 0-8.79.42A2.5 2.5 0 0 0 1.44 7C1 8.6 1 12 1 12s0 3.4.44 5a2.5 2.5 0 0 0 1.77 1.78c1.59.42 8.79.42 8.79.42s7.2 0 8.79-.42A2.5 2.5 0 0 0 22.56 17C23 15.4 23 12 23 12zM9.75 15.02V8.98L15.5 12z"/></svg></a>
          <a class="lets-talk__socials-link" href="{{SOCIAL_TIKTOK}}" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.84-2.48v-3.2a5.77 5.77 0 1 0 4.93 5.71V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg></a>
          </div>

          <!-- מלכודת דבש: מוסתר מבני אדם, נראה לבוטים. ראו api/contact.js -->
          <div class="hp" aria-hidden="true">
            <label for="website">אל תמלא שדה זה</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="form-group-field --is-consent">
            <label class="consent">
              <input type="checkbox" name="consent" value="1">
              <span class="consent__box" aria-hidden="true"></span>
              <span class="consent__text">אני מאשר/ת שהפרטים שמסרתי ייאספו ויישמרו במאגר המידע של Digital Frame לצורך מענה לפנייה, בהתאם ל<a href="/privacy-policy">מדיניות הפרטיות</a>. מסירת הפרטים נעשית מרצוני החופשי.</span>
            </label>
            <span class="form-error" aria-live="polite"></span>
          </div>

          <div class="form-group --is-submit">
            <button class="cta-1" type="submit">שליחה
              <span class="arw-box"><svg class="arw a1" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 18L6 6M6 6h9M6 6v9"/></svg><svg class="arw a2" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 18L6 6M6 6h9M6 6v9"/></svg></span>
            </button>
          </div>

          <div class="form-status" role="status" aria-live="polite"></div>
        </form>
      </div>

    </div>
  </div>
</section>
